<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07131c" />
    <title>What time is it?</title>
    <style>
      :root {
        --bg: #061019;
        --glow: #123344;
        --card: #0b1d28ee;
        --text: #f5fbff;
        --muted: #94acb8;
        --line: #ffffff1f;
        --input: #07151f;
        --accent: #55d5ca;
        --shadow: 0 28px 80px #0006;
      }
      html[data-theme="light"] {
        --bg: #eef5f7;
        --glow: #c9e8ef;
        --card: #ffffffeb;
        --text: #0b2330;
        --muted: #617783;
        --line: #0a2c3c24;
        --input: #f8fcfd;
        --accent: #087f79;
        --shadow: 0 28px 80px #214c5e29;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 0, var(--glow), transparent 38%),
          var(--bg);
        color: var(--text);
        font:
          16px/1.45 Inter,
          system-ui,
          sans-serif;
        transition: 0.35s;
      }
      .app {
        width: min(700px, calc(100% - 28px));
        margin: auto;
        padding: 24px 0;
      }
      header,
      footer,
      .summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        font-weight: 850;
        letter-spacing: 0.1em;
      }
      .brand-logo {
        width: 28px;
        height: 28px;
        object-fit: cover;
        border-radius: 6px;
        box-shadow:
          0 0 0 1px var(--line),
          0 5px 14px #0003;
      }
      .theme {
        display: flex;
        align-items: center;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 3.7rem);
        letter-spacing: -0.055em;
        line-height: 1;
        margin: 25px 0 8px;
      }
      .intro {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 24px;
        backdrop-filter: blur(18px);
      }
      .search {
        position: relative;
        z-index: 8;
      }
      .search-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .search-row input {
        flex: 1;
        min-width: 0;
      }
      .country-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        border: 1px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 11px;
        font-size: 0.82rem;
        cursor: pointer;
      }
      .country-chip[hidden] {
        display: none;
      }
      .group-label {
        padding: 8px 13px 5px;
        color: var(--accent);
        font-size: 0.67rem;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: var(--input);
      }
      input {
        font: inherit;
      }
      .search input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--input);
        color: var(--text);
        outline: 0;
      }
      .results {
        display: none;
        position: absolute;
        top: calc(100% + 7px);
        left: 0;
        right: 0;
        max-height: 250px;
        overflow: auto;
        background: var(--input);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }
      .results.open {
        display: block;
      }
      .result {
        display: block;
        width: 100%;
        padding: 11px 13px;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        color: var(--text);
        cursor: pointer;
      }
      .result small {
        display: block;
        color: var(--muted);
      }
      .location {
        text-align: center;
        margin-top: 23px;
      }
      .city {
        font-size: 1.35rem;
        font-weight: 780;
      }
      .zone {
        color: var(--muted);
        font-size: 0.86rem;
        margin-top: 4px;
      }
      .clock-wrap {
        display: grid;
        place-items: center;
        padding: 22px 0 15px;
      }
      .clock {
        width: min(330px, 78vw);
        aspect-ratio: 1;
        border-radius: 50%;
        position: relative;
        border: 1px solid #ffffff52;
        box-shadow:
          inset 0 0 0 10px #0002,
          0 24px 58px #0005;
        transition: background 1s;
      }
      .early-morning {
        background:
          radial-gradient(circle at 72% 18%, #ffe5a4 0 6%, transparent 7%),
          linear-gradient(155deg, #313b68, #e58d72);
      }
      .morning {
        background:
          radial-gradient(
            circle at 25% 24%,
            #fff2a8 0 7%,
            #ffc85d 8%,
            transparent 20%
          ),
          linear-gradient(155deg, #65c9e8, #2884ad);
      }
      .noon {
        background:
          radial-gradient(
            circle at 50% 17%,
            #fff8bd 0 8%,
            #ffd75a 9%,
            transparent 22%
          ),
          linear-gradient(155deg, #48bfea, #146caa);
      }
      .afternoon {
        background:
          radial-gradient(
            circle at 72% 31%,
            #ffe68b 0 7%,
            #ffb43e 8%,
            transparent 21%
          ),
          linear-gradient(155deg, #439dca, #245b91);
      }
      .evening {
        background:
          radial-gradient(
            circle at 78% 57%,
            #ffd081 0 7%,
            #f37c4c 8%,
            transparent 23%
          ),
          linear-gradient(155deg, #583c78, #bc5e67);
      }
      .night {
        background:
          radial-gradient(circle at 72% 22%, #f5f1cf 0 6%, transparent 7%),
          linear-gradient(155deg, #17274c, #071326);
      }
      .late-night {
        background:
          radial-gradient(circle at 70% 20%, #dce9ea 0 5%, transparent 6%),
          linear-gradient(155deg, #131a35, #050914);
      }
      .clock:after {
        display: none;
      }
      .face-group {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 75%;
        bottom: auto;
        transform: translate(-50%, -50%);
        width: 78%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 3px;
        text-align: center;
        color: white;
        text-shadow: 0 2px 10px #0008;
      }
      .weather-icon {
        position: static;
        font-size: 1.65rem;
        line-height: 1.05;
        color: #fff;
        text-shadow: 0 2px 12px #0008;
        transition: color 0.8s;
      }
      .mark {
        z-index: 1;
      }
      .mark {
        position: absolute;
        inset: 9px;
        text-align: center;
        transform: rotate(calc(var(--i) * 30deg));
        font-size: 0.76rem;
        color: #ffffffc2;
      }
      .mark span {
        display: inline-block;
        transform: rotate(calc(var(--i) * -30deg));
      }
      .hand {
        position: absolute;
        z-index: 3;
        left: 50%;
        bottom: 50%;
        transform-origin: 50% 100%;
        border-radius: 20px;
      }
      .hour {
        width: 6px;
        height: 24%;
        background: currentColor;
      }
      .minute {
        width: 4px;
        height: 34%;
        background: currentColor;
      }
      .second {
        width: 2px;
        height: 39%;
        background: currentColor;
      }
      .pin {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        margin: -7px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 28%, transparent);
      }
      .pulse-word {
        position: absolute;
        z-index: 2;
        top: 29%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.34em;
        padding-left: 0.34em;
        color: #eafcff;
        text-shadow: 0 1px 12px #0007;
        transition:
          color 0.8s,
          opacity 0.8s;
      }
      .pulse-model {
        margin-top: 3px;
        font-family: Inter, system-ui, sans-serif;
        font-size: 0.46rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .early-morning .pulse-word {
        color: #ffe8cf;
      }
      .morning .pulse-word,
      .noon .pulse-word {
        color: #f7ffff;
      }
      .afternoon .pulse-word {
        color: #fff0c7;
      }
      .evening .pulse-word {
        color: #ffd4c2;
      }
      .night .pulse-word,
      .late-night .pulse-word {
        color: #b8e7ef;
      }
      .face {
        position: static;
        width: 100%;
        text-align: center;
        color: inherit;
        text-shadow: inherit;
      }
      .face-reading {
        font-size: 1.42rem;
        font-weight: 800;
      }
      .face-condition {
        font-size: 0.8rem;
        font-weight: 700;
        opacity: 0.88;
      }
      .state {
        text-transform: uppercase;
        font-size: 0.64rem;
        font-weight: 800;
        letter-spacing: 0.15em;
      }
      .digital {
        text-align: center;
        font-size: 2rem;
        font-weight: 800;
      }
      .summary {
        justify-content: center;
        gap: 12px;
        margin-top: 6px;
      }
      .temp {
        font-size: 1.25rem;
        font-weight: 750;
      }
      .condition {
        color: var(--muted);
      }
      .units {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .unit {
        border: 0;
        background: none;
        color: var(--muted);
        padding: 5px 9px;
        cursor: pointer;
      }
      .unit.active {
        background: var(--accent);
        color: var(--bg);
        font-weight: 800;
      }
      .error {
        text-align: center;
        color: #e88b83;
        font-size: 0.82rem;
        min-height: 1.2em;
      }
      footer {
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        color: var(--muted);
        font-size: 0.73rem;
        padding: 20px 3px;
        text-align: center;
      }
      @media (max-width: 520px) {
        .card {
          padding: 17px;
        }
        .summary {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

        a.dataset.city = city;
        a.dataset.country = country;
        a.dataset.cc = cc;
        a.dataset.render = renderId;
        a._setResolved = (x) => {
          resolved = x;
        };
        return a;
      }
      const cityRegionObserver = new IntersectionObserver((entries) =>
        entries.forEach(async (entry) => {
          if (!entry.isIntersecting) return;
          let a = entry.target;
          cityRegionObserver.unobserve(a);
          try {
            let j = await (
                await fetch(
                  `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(a.dataset.city)}&count=20&language=en&format=json`,
                )
              ).json(),
              matches = (j.results || []).filter(
                (x) => x.country_code === a.dataset.cc,
              ),
              x =
                matches.find(
                  (x) => x.name.toLowerCase() === a.dataset.city.toLowerCase(),
                ) || matches[0];
            if (!x || +a.dataset.render !== countryRenderSeq || !a.isConnected)
              return;
            a.textContent =
              flag(a.dataset.cc) +
              " " +
              a.dataset.city +
              (x.admin1 ? ", " + x.admin1 : "");
            a._setResolved(x);
          } catch {}
        }),
      );
      function selectResolvedCity(x, country, cc, box) {
        userSelected = true;
        box.classList.remove("open");
        $("#search").value = "";
        setPlace({
          name: x.name,
          admin1: x.admin1 || "",
          admin2: x.admin2 || "",
          country: x.country || country,
          cc: x.country_code || cc,
          tz: x.timezone,
          lat: x.latitude,
          lon: x.longitude,
        });
      }
      function previewLocation(city, state, country, cc) {
        userSelected = true;
        $("#city").textContent =
          `${flag(cc)} ${[city, state, country].filter(Boolean).join(", ")}`;
        $("#zone").textContent = "Locating time zone…";
      }
      function previewCountry(country, cc) {
        let zones = [
          ...new Set(countryZones.filter((x) => x.cc === cc).map((x) => x.tz)),
        ];
        $("#city").textContent = `${flag(cc)} ${country}`;
        $("#zone").textContent =
          zones.length === 1
            ? zones[0].replaceAll("_", " ") + " · " + offset(zones[0])
            : "Multiple time zones · select a city";
        $("#error").textContent = "";
      }
      async function chooseCountryCity(city, country, cc, box, state = "") {
        previewLocation(city, state, country, cc);
        box.classList.remove("open");
        $("#search").value = "";
        $("#error").textContent = "";
        try {
          let query = [city, state, country].filter(Boolean).join(", "),
            j = await (
              await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=50&language=en&format=json`,
              )
            ).json(),
            matches = (j.results || []).filter((r) => r.country_code === cc);
          if (!matches.length && query !== city) {
            j = await (
              await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=50&language=en&format=json`,
              )
            ).json();
            matches = (j.results || []).filter((r) => r.country_code === cc);
          }
          let exact = matches.filter(
              (r) => r.name.toLowerCase() === city.toLowerCase(),
            ),
            x =
              (state
                ? exact.find((r) =>
                    [r.admin1, r.admin2].some(
                      (v) => v && v.toLowerCase() === state.toLowerCase(),
                    ),
                  )
                : null) ||
              exact[0] ||
              matches[0];
          if (!x) throw Error();
          selectResolvedCity(x, country, cc, box);
        } catch {
          $("#zone").textContent = "Time zone unavailable";
          $("#error").textContent = "Unable to locate the selected city.";
        }
      }
      async function getStateCities(state) {
        if (stateCityCache.has(state)) return stateCityCache.get(state);
        let request = fetch(
          "https://countriesnow.space/api/v0.1/countries/state/cities",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ country: selectedCountry.country, state }),
          },
        )
          .then((r) => r.json())
          .then((j) => (Array.isArray(j.data) ? j.data : []))
          .catch(() => []);
        stateCityCache.set(state, request);
        return request;
      }
      async function renderCountryCities(filter = "") {
        let box = $("#results"),
          needle = filter.toLowerCase(),
          cities = countryCities.filter((x) =>
            x.toLowerCase().startsWith(needle),
          ),
          states = needle
            ? countryStates.filter((x) => x.toLowerCase().startsWith(needle))
            : [],
          renderId = ++countryRenderSeq,
          filterId = ++countryFilterSeq;
        box.innerHTML = "";
        box.classList.add("open");
        if (cities.length) {
          addGroup(
            box,
            needle ? "Matching cities" : "Cities in " + selectedCountry.country,
          );
          cities.forEach((city) =>
            box.appendChild(
              cityButton(
                city,
                selectedCountry.country,
                selectedCountry.cc,
                box,
                renderId,
              ),
            ),
          );
        }
        if (states.length) {
          let stateRows = await Promise.all(
            states
              .slice(0, 8)
              .map(async (state) => [state, await getStateCities(state)]),
          );
          if (filterId !== countryFilterSeq) return;
          addGroup(box, "Matching states / provinces");
          let shown = new Set(cities.map((x) => x.toLowerCase()));
          stateRows.forEach(([state, list]) =>
            list.forEach((city) => {
              let key = city.toLowerCase();
              if (shown.has(key)) return;
              shown.add(key);
              box.appendChild(
                cityButton(
                  city,
                  selectedCountry.country,
                  selectedCountry.cc,
                  box,
                  renderId,
                  state,
                ),
              );
            }),
          );
        }
        if (!cities.length && !states.length)
          box.innerHTML =
            '<button class="result">No matching city, state or province</button>';
      }
      async function selectCountry(country, cc) {
        userSelected = true;
        selectedCountry = { country, cc };
        countryCities = [];
        countryStates = [];
        stateCityCache = new Map();
        countryLoading = true;
        $("#countryChipText").textContent = country;
        $("#countryChip").hidden = false;
        $("#search").value = "";
        $("#search").placeholder = "Filter cities and states…";
        let box = $("#results");
        box.innerHTML = "";
        box.classList.remove("open");
        previewCountry(country, cc);
        try {
          let options = {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ country }),
            },
            [citiesResponse, statesResponse] = await Promise.all([
              fetch(
                "https://countriesnow.space/api/v0.1/countries/cities",
                options,
              ),
              fetch(
                "https://countriesnow.space/api/v0.1/countries/states",
                options,
              ),
            ]),
            citiesJson = await citiesResponse.json(),
            statesJson = await statesResponse.json();
          if (
            !citiesResponse.ok ||
            citiesJson.error ||
            !Array.isArray(citiesJson.data)
          )
            throw Error();
          countryCities = [...new Set(citiesJson.data)].sort((a, b) =>
            a.localeCompare(b),
          );
          countryStates = [
            ...new Set(
              ((statesJson.data && statesJson.data.states) || [])
                .map((x) => x.name)
                .filter(Boolean),
            ),
          ].sort((a, b) => a.localeCompare(b));
          countryLoading = false;
          let q = $("#search").value.trim();
          if (q) renderCountryCities(q);
        } catch {
          countryLoading = false;
          countryCities = [];
          countryStates = [];
          if ($("#search").value.trim()) {
            box.innerHTML =
              '<button class="result">City list unavailable. Clear the country and search for a city directly.</button>';
            box.classList.add("open");
          }
        }
      }
      function clearCountry() {
        selectedCountry = null;
        countryCities = [];
        countryStates = [];
        stateCityCache = new Map();
        countryLoading = false;
        countryFilterSeq++;
        $("#countryChip").hidden = true;
        $("#search").value = "";
        $("#search").placeholder = "Search a city or country…";
        $("#results").classList.remove("open");
        $("#search").focus();
      }
      async function search(q) {
        const seq = ++searchSeq,
          box = $("#results"),
          needle = q.trim().toLowerCase();
        box.innerHTML = '<button class="result">Searching…</button>';
        box.classList.add("open");
        const countries = [
          ...new Map(
            countryZones.map((z) => [z.cc, regionNames.of(z.cc)]),
          ).entries(),
        ]
          .filter(([, name]) => name && name.toLowerCase().startsWith(needle))
          .sort((a, b) => {
            let A = a[1].toLowerCase().startsWith(needle) ? 0 : 1,
              B = b[1].toLowerCase().startsWith(needle) ? 0 : 1;
            return A - B || a[1].localeCompare(b[1]);
          })
          .slice(0, 8);
        let cityResults = [];
        try {
          let j = await (
            await fetch(
              `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=12&language=en&format=json`,
            )
          ).json();
          cityResults = (j.results || []).filter((x) =>
            x.name.toLowerCase().startsWith(needle),
          );
        } catch {}
        if (seq !== searchSeq) return;
        box.innerHTML = "";
        if (countries.length) {
          addGroup(box, "Countries");
          countries.forEach(([cc, country]) => {
            let a = document.createElement("button");
            a.className = "result";
            a.textContent = flag(cc) + " " + country;
            a.onclick = () => selectCountry(country, cc);
            box.appendChild(a);
          });
        }
        if (cityResults.length) {
          addGroup(box, "Cities");
          cityResults.forEach((x) => {
            let a = document.createElement("button");
            a.className = "result";
            a.innerHTML = `${flag(x.country_code)} ${x.name}, ${x.country}<small>${x.admin1 || "City"} · ${x.timezone}</small>`;
            a.onclick = () => {
              userSelected = true;
              box.classList.remove("open");
              $("#search").value = "";
              setPlace({
                name: x.name,
                admin1: x.admin1 || "",
                admin2: x.admin2 || "",
                country: x.country,
                cc: x.country_code,
                tz: x.timezone,
                lat: x.latitude,
                lon: x.longitude,
              });
            };
            box.appendChild(a);
          });
        }
        if (!countries.length && !cityResults.length)
          box.innerHTML =
            '<button class="result">No matching city or country</button>';
      }
      $("#countryChip").onclick = clearCountry;
      $("#search").onfocus = () => {};
      $("#search").oninput = (e) => {
        clearTimeout(timer);
        let q = e.target.value.trim();
        if (selectedCountry) {
          if (!q) return $("#results").classList.remove("open");
          if (countryLoading) {
            $("#results").innerHTML =
              '<button class="result">Loading cities and states…</button>';
            return $("#results").classList.add("open");
          }
          return renderCountryCities(q);
        }
        if (q.length < 2) return $("#results").classList.remove("open");
        timer = setTimeout(() => search(q), 260);
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search"))
          $("#results").classList.remove("open");
      });
      document.querySelectorAll(".unit[data-u]").forEach(
        (b) =>
          (b.onclick = () => {
            u = b.dataset.u;
            document
              .querySelectorAll(".unit[data-u]")
              .forEach((x) => x.classList.toggle("active", x === b));
            showTemp();
          }),
      );
      document.querySelectorAll(".theme-option").forEach(
        (b) =>
          (b.onclick = () => {
            themeOverride = true;
            document.documentElement.dataset.theme = b.dataset.theme;
            document
              .querySelectorAll(".theme-option")
              .forEach((x) => x.classList.toggle("active", x === b));
          }),
      );
      navigator.geolocation
        ? navigator.geolocation.getCurrentPosition(
            (x) => {
              if (!userSelected)
                setPlace({
                  name: "Current location",
                  country: "",
                  cc: "",
                  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                  lat: x.coords.latitude,
                  lon: x.coords.longitude,
                });
            },
            () => {
              if (!userSelected) setPlace(p);
            },
            { timeout: 5000 },
          )
        : setPlace(p);
      setInterval(tick, 1000);
      tick();
    </script>
  </body>
</html>
