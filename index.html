<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Chrono</title>
<style>
:root{
  --face:#ffffff;
  --ink:#0b1220;
  --muted:rgba(11,18,32,.55);
  --shadow:rgba(0,0,0,.28);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
html,html{min-height:100%}



body{
  overflow-y: auto;   

  margin:0;
  display:grid;
  place-items:center;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% 15%, rgba(255,255,255,.08), transparent 30%),
    linear-gradient(180deg,#101521,#05080f);
  color:white;
  min-height:100vh;
  min-height:100dvh;
  padding:24px 0;
 
}
.app{
  width:min(92vw,760px);
  display:grid;
  justify-items:center;
  gap:22px;
}
.title{
  text-align:center;
}
.title small{
  display:block;
  text-transform:uppercase;
  letter-spacing:.18em;
  color:#9fb1c9;
  font-size:.72rem;
  margin-bottom:6px;
}
.title h1{
  margin:0;
  font-size:clamp(1.5rem,3vw,2.3rem);
  letter-spacing:-.03em;
}
.clock-shell{
  width:min(76vw,560px);
  aspect-ratio:1;
  border-radius:50%;
  padding:18px;
  background:linear-gradient(145deg,#303846,#0e131d);
  box-shadow:
    0 34px 80px rgba(0,0,0,.45),
    inset 0 1px 1px rgba(255,255,255,.18);
}
.clock{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  background:var(--face);
  color:var(--ink);
  box-shadow:
    inset 0 0 45px rgba(255,255,255,.18),
    inset 0 0 90px rgba(0,0,0,.08),
    0 6px 20px rgba(0,0,0,.3);
  transition:background 1.2s linear,color 1.2s linear;
}
.tick{
  position:absolute;
  inset:4%;
  transform:rotate(calc(var(--i) * 6deg));
}
.tick::before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:3.2%;
  border-radius:99px;
  background:currentColor;
  opacity:.32;
}
.tick.major::before{
  width:4px;
  height:5.4%;
  opacity:.72;
}
.number{
  position:absolute;
  inset:10%;
  display:grid;
  place-items:center;
  transform:rotate(calc(var(--n) * 30deg));
}
.number span{
  display:block;
  transform:rotate(calc(var(--n) * -30deg));
  font-size:clamp(1rem,3.2vw,1.8rem);
  font-weight:700;
  letter-spacing:-.04em;
}
.brand{
  position:absolute;
  left:50%;
  top:31%;
  transform:translateX(-50%);
  text-align:center;
  color:currentColor;
}
.brand b{
  display:block;
  font-size:clamp(.75rem,1.7vw,1rem);
  letter-spacing:.16em;
}
.brand small{
  opacity:.55;
  font-size:.65rem;
}
.hand{
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  bottom:auto;
  transform-origin:50% 100%;
  translate:-50% -100%;
  border-radius:999px;
  background:currentColor;
  box-shadow:0 2px 5px rgba(0,0,0,.18);
}
.hour-hand{
  width:2.2%;
  height:24%;
}
.minute-hand{
  width:1.45%;
  height:34%;
  opacity:1;
  transition:opacity .25s ease;
}
.minute-hand.hidden{
  opacity:0;
}
.second-hand{
  width:.65%;
  height:38%;
  background:#d5343f;
  box-shadow:none;
  opacity:1;
  transition:opacity .25s ease;
}
.second-hand.hidden{
  opacity:0;
}
.second-hand::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-18%;
  width:100%;
  height:20%;
  transform:translateX(-50%);
  background:inherit;
  border-radius:999px;
}
.pin{
  position:absolute;
  z-index:6;
  left:50%;
  top:50%;
  width:4.6%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#d5343f;
  border:4px solid rgba(255,255,255,.75);
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.status{
  position:absolute;
  z-index:2;
  left:50%;
  bottom:23%;
  transform:translateX(-50%);
  text-align:center;
  min-width:170px;
}
.digital-time{
display:inline-flex;
align-items:center;
justify-content:center;
color:var(--ink);
font-family:Inter,"Atkinson Hyperlegible","Roboto Flex",Arial,sans-serif;
font-size:clamp(2.1rem,5.6vw,3.2rem);
font-weight:900;
font-variant-numeric:tabular-nums;
letter-spacing:.03em;
line-height:1;
white-space:nowrap;
text-shadow:0 2px 6px rgba(0,0,0,.35);
-webkit-font-smoothing:antialiased;
}
}

@supports not (-webkit-text-stroke:.35px color-mix(in srgb, black 78%, transparent)){
  .digital-time{
    -webkit-text-stroke:.35px rgba(127,127,127,.45);
  }
}


.status strong{
  display:block;
  font-size:clamp(.72rem,1.6vw,.92rem);
  margin-top:7px;
}
.status span{
  display:block;
  font-size:.64rem;
  opacity:.58;
  margin-top:2px;
}
.meta{
  display:flex;
  align-items:center;
  gap:12px;
  color:#b9c6d8;
  font-size:.86rem;
}
.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--face);
  box-shadow:0 0 18px var(--face);
  transition:background 1.2s linear,box-shadow 1.2s linear;
}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}
.demo-panel{
  width:min(92vw,520px);
  padding:16px 18px;
  border:1px solid rgba(255,255,255,.11);
  border-radius:18px;
  background:rgba(255,255,255,.055);
  backdrop-filter:blur(12px);
}
.slider-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:12px;
  color:#c7d3e4;
  font-size:.84rem;
}
.slider-row strong{
  color:white;
  white-space:nowrap;
}
input[type="range"]{
  width:100%;
  accent-color:#8fc8ff;
  cursor:pointer;
}
.slider-marks{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  color:#8594a9;
  font-size:.68rem;
}
button{
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.07);
  color:white;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
}
button:hover{background:rgba(255,255,255,.12)}
@media(max-width:620px){
  .chronotype-buttons,
  .workstate-buttons{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .clock-shell{width:88vw;padding:12px}
  .status{bottom:23%}
}
</style>

function hexToRgb(hex){
  const h = hex.replace("#","");
  return {
    r:parseInt(h.slice(0,2),16),
    g:parseInt(h.slice(2,4),16),
    b:parseInt(h.slice(4,6),16)
  };
}
function mix(a,b,t){
  const A=hexToRgb(a), B=hexToRgb(b);
  const r=Math.round(A.r+(B.r-A.r)*t);
  const g=Math.round(A.g+(B.g-A.g)*t);
  const bl=Math.round(A.b+(B.b-A.b)*t);
  return `rgb(${r},${g},${bl})`;
}
function contrastColor(rgb){
  const m=rgb.match(/\d+/g).map(Number);
  const y=(m[0]*299+m[1]*587+m[2]*114)/1000;
  return y>155 ? "#07101c" : "#ffffff";
}

function applyWorkState(baseColor){
  const state = workStates[activeWorkState];
  if(!state.tint || state.strength === 0) return baseColor;

  const base = baseColor.match(/\d+/g).map(Number);
  const tint = hexToRgb(state.tint);
  const k = state.strength;
  const r = Math.round(base[0] + (tint.r - base[0]) * k);
  const g = Math.round(base[1] + (tint.g - base[1]) * k);
  const b = Math.round(base[2] + (tint.b - base[2]) * k);
  return `rgb(${r},${g},${b})`;
}
function update(){
  let h,m,s;
  if(mode==="live"){
    const now=new Date();
    h=now.getHours(); m=now.getMinutes(); s=now.getSeconds()+now.getMilliseconds()/1000;
  }else{
    const elapsed=(performance.now()-demoStart)/1000;
    const day=(elapsed/demoDurationSeconds)%1;
    const total=day*24;
    h=Math.floor(total);
    m=Math.floor((total-h)*60);
    s=((total*60-mathFloorSafe(total*60))*60);
  }

  const fractionalHour=h+m/60+s/3600;
  const current=Math.floor(fractionalHour)%24;
  const next=(current+1)%24;
  const t=fractionalHour-Math.floor(fractionalHour);
  const biologicalFace=mix(anchors[current].c,anchors[next].c,t);
  const face=applyWorkState(biologicalFace);
  const ink=contrastColor(face);

  document.documentElement.style.setProperty("--face",face);
  document.documentElement.style.setProperty("--ink",ink);

  const hourDeg=((h%12)+m/60+s/3600)*30;
  const minuteDeg=(m+s/60)*6;
  const secondDeg=s*6;

  hourHand.style.transform=`rotate(${hourDeg}deg)`;
  minuteHand.style.transform=`rotate(${minuteDeg}deg)`;
  secondHand.style.transform=`rotate(${secondDeg}deg)`;

  const workState = workStates[activeWorkState];
  stateLabel.textContent = workState.label
    ? `${workState.label} · ${anchors[current].s}`
    : anchors[current].s;

  const displayHour = h % 12 === 0 ? 12 : h % 12;
  digitalClock.textContent =
    String(displayHour).padStart(2,"0") + ":" +
    String(m).padStart(2,"0");
  timeLabel.textContent = "Current biological phase";

  requestAnimationFrame(update);
}
function mathFloorSafe(n){ return Math.floor(n); }

function updateDemoHandVisibility(){
  if(mode === "live"){
    minuteHand.classList.remove("hidden");
    secondHand.classList.remove("hidden");
    return;
  }

  secondHand.classList.add("hidden");

  if(demoDurationSeconds === 24){
    minuteHand.classList.remove("hidden");
  }else{
    minuteHand.classList.add("hidden");
  }
}

document.getElementById("liveBtn").addEventListener("click",()=>{
  mode="live";
  updateDemoHandVisibility();
  metaText.textContent="Live color follows the current local time";
});
durationSlider.addEventListener("input",()=>{
  const option = durationOptions[Number(durationSlider.value)];
  demoDurationSeconds = option.seconds;
  durationLabel.textContent = option.label;

  if(mode === "demo"){
    demoStart = performance.now();
    updateDemoHandVisibility();
    metaText.textContent = `24 hours compressed into ${option.label}`;
  }
});

demoBtn.addEventListener("click",()=>{
  mode="demo";
  demoStart=performance.now();
  const option = durationOptions[Number(durationSlider.value)];
  demoDurationSeconds = option.seconds;
  updateDemoHandVisibility();
  metaText.textContent = `24 hours compressed into ${option.label}`;
  demoBtn.textContent = "Restart 24-hour demo";
});

document.querySelectorAll(".chronotype-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    activeProfileKey = button.dataset.profile;
    anchors = profiles[activeProfileKey].anchors;

    document.querySelectorAll(".chronotype-btn").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");

    const workName = workStates[activeWorkState].name;
    metaText.textContent = `${profiles[activeProfileKey].name} · ${workName}`;
    chronotypeNote.textContent = profiles[activeProfileKey].note;
  });
});

document.querySelectorAll(".workstate-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    activeWorkState = button.dataset.workstate;

    document.querySelectorAll(".workstate-btn").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");

    metaText.textContent = `${profiles[activeProfileKey].name} · ${workStates[activeWorkState].name}`;
  });
});

update();
</script>
</body>
</html>
